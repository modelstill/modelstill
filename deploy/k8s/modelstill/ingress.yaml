apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@modelstill.com
    privateKeySecretRef: { name: letsencrypt-dns-account }
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: { name: cloudflare-api-token, key: api-token }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: modelstill-tls
spec:
  secretName: modelstill-tls
  issuerRef: { name: letsencrypt-dns, kind: Issuer }
  dnsNames: [app.modelstill.com, api.modelstill.com, mcp.modelstill.com]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modelstill
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.modelstill.com, api.modelstill.com]
      secretName: modelstill-tls
  rules:
    - host: app.modelstill.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: website, port: { number: 4321 } } } }
    - host: api.modelstill.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: api, port: { number: 8787 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modelstill-mcp
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [mcp.modelstill.com]
      secretName: modelstill-tls
  rules:
    - host: mcp.modelstill.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: mcp, port: { number: 3104 } } } }
