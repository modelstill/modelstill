apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: modelstill
labels:
  - pairs:
      app.kubernetes.io/part-of: modelstill
resources:
  - api.yaml
  - website.yaml
  - mcp.yaml
  - migrate-job.yaml
  - networkpolicy.yaml
  - ingress.yaml
images:
  - { name: modelstill-api, newName: ghcr.io/replace-owner/modelstill-api, newTag: "0000000" }
  - { name: modelstill-website, newName: ghcr.io/replace-owner/modelstill-website, newTag: "0000000" }
  - { name: modelstill-mcp, newName: ghcr.io/replace-owner/modelstill-mcp, newTag: "0000000" }
